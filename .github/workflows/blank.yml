name: Part 1 - Validate Docs Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check required files are present in /docs
        run: |
          missing=0

          if ! ls docs/*ERD*.png 1> /dev/null 2>&1 && ! ls docs/*ERD*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: ERD file (PNG or PDF) not found in /docs."
            missing=1
          else
            echo "ERD file found."
          fi

          if ! ls docs/*Endpoint*.md 1> /dev/null 2>&1 && ! ls docs/*Endpoint*.pdf 1> /dev/null 2>&1 && ! ls docs/*Endpoint*.docx 1> /dev/null 2>&1; then
            echo "ERROR: API Endpoint Plan (md or pdf) not found in /docs."
            missing=1
          else
            echo "API Endpoint Plan found."
          fi

          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: SQL schema (.sql) not found in /docs."
            missing=1
          else
            echo "SQL schema found."
          fi

          if [ $missing -eq 1 ]; then
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md not found in repository root."
            exit 1
          fi
          echo "README.md found."

      - name: Success
        run: echo "✅ Repository structure for Part 1 is valid."
